<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine para dos 💖</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        romantic: {
                            50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f472b6', 400: '#ec4899',
                            500: '#db2777', 600: '#be185d', 700: '#9d174d', 800: '#831843', 900: '#500724', 950: '#380415'
                        },
                        darkbg: '#0a0508'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0508;
            color: #fce7f3;
        }
        body { height: 100dvh; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #150810; }
        ::-webkit-scrollbar-thumb { background: #831843; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #db2777; }

        @keyframes floatUpEmoji {
            0% { transform: translateY(0px) scale(0.6); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-160px) scale(1.8); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            animation: floatUpEmoji 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            z-index: 60;
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
            font-weight: bold;
        }

        /* Controles del video: visibles al pasar el mouse, en pausa, o siempre en pantallas táctiles */
        #video-controls { opacity: 0; transition: opacity 0.3s; }
        #video-container:hover #video-controls,
        #video-container.is-paused #video-controls,
        #video-controls:focus-within { opacity: 1; }
        @media (hover: none) { #video-controls { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col overflow-hidden selection:bg-pink-500 selection:text-white">

    <!-- BARRA SUPERIOR -->
    <header class="bg-[#120610]/90 backdrop-blur-md border-b border-pink-900/40 px-4 py-2.5 flex items-center justify-between shrink-0 z-20 h-14">
        <div class="flex items-center space-x-3 min-w-0">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-600 to-rose-400 flex items-center justify-center shadow-lg shadow-pink-900/40 shrink-0">
                <i class="fa-solid fa-heart text-white text-base"></i>
            </div>
            <div class="min-w-0">
                <div class="flex items-center space-x-2">
                    <h1 class="font-bold text-base sm:text-lg tracking-wide text-white truncate" data-i18n="h1">Cine para dos</h1>
                    <span class="hidden sm:inline-block px-2 py-0.5 text-[10px] font-semibold bg-pink-950/80 text-pink-300 border border-pink-800/60 rounded-full shrink-0">
                        <i class="fa-solid fa-sparkles mr-1"></i><span data-i18n="badge">Noche de Pelis</span>
                    </span>
                </div>
                <div class="flex items-center space-x-1.5">
                    <span id="connection-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
                    <p id="connection-text" class="text-xs text-pink-300/80 truncate">Conectando...</p>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
            <!-- Selector de idioma -->
            <div class="flex rounded-lg overflow-hidden border border-pink-800/50 text-xs font-semibold">
                <button id="lang-es" onclick="setLang('es')" class="px-2.5 py-1.5 transition">ES</button>
                <button id="lang-ru" onclick="setLang('ru')" class="px-2.5 py-1.5 transition">RU</button>
            </div>
            <button onclick="copiarEnlace()" class="flex items-center space-x-1.5 px-3 py-1.5 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white rounded-lg text-xs font-medium shadow-md shadow-pink-900/30 transition">
                <i class="fa-solid fa-link"></i>
                <span class="hidden sm:inline" data-i18n="copiar">Copiar Enlace</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">

        <!-- REPRODUCTOR -->
        <section id="video-section" class="flex-1 flex flex-col h-1/2 lg:h-full bg-[#0a0508] relative overflow-hidden p-3 sm:p-4 min-h-0 min-w-0">

            <div id="upload-screen" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-pink-900/50 rounded-2xl bg-gradient-to-b from-[#130710]/50 to-[#0d040a]/80 p-6 text-center relative overflow-hidden group shadow-2xl">
                <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-tr from-pink-600 to-rose-400 flex items-center justify-center shadow-lg shadow-pink-600/30 mb-4 transform group-hover:scale-105 transition duration-300">
                    <i class="fa-solid fa-clapperboard text-white text-2xl sm:text-3xl"></i>
                </div>
                <h2 class="text-xl sm:text-2xl font-bold text-white mb-2" data-i18n="sube_titulo">Elige la película para esta noche 🍿✨</h2>
                <p class="text-xs sm:text-sm text-pink-300/70 max-w-md mb-6" data-i18n="sube_desc"></p>
                <label class="px-6 py-3 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white rounded-xl font-semibold text-sm shadow-lg shadow-pink-600/30 cursor-pointer transform hover:-translate-y-0.5 transition duration-200 flex items-center space-x-2">
                    <i class="fa-solid fa-folder-open"></i>
                    <span data-i18n="sube_btn">Seleccionar video</span>
                    <input type="file" id="video-file-input" accept="video/*" class="hidden" onchange="cargarVideoLocal(event)">
                </label>
            </div>

            <div id="video-container" class="hidden flex-1 flex flex-col bg-black rounded-2xl overflow-hidden relative shadow-2xl border border-pink-900/30 min-h-0">
                <video id="main-video" playsinline class="w-full h-full object-contain cursor-pointer" onclick="togglePlay()"></video>

                <div id="video-controls" class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-4 flex flex-col space-y-2">
                    <div class="flex items-center space-x-3">
                        <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" class="w-full h-1.5 bg-pink-950/80 rounded-lg appearance-none cursor-pointer accent-pink-500" oninput="cambiarProgreso(this.value)">
                    </div>
                    <div class="flex items-center justify-between text-white text-sm">
                        <div class="flex items-center space-x-4">
                            <button onclick="togglePlay()" class="hover:text-pink-400 transition"><i id="play-icon" class="fa-solid fa-play text-lg"></i></button>
                            <button onclick="saltoTiempo(-10)" class="hover:text-pink-400 transition"><i class="fa-solid fa-rotate-left"></i></button>
                            <button onclick="saltoTiempo(10)" class="hover:text-pink-400 transition"><i class="fa-solid fa-rotate-right"></i></button>
                            <div class="flex items-center space-x-2">
                                <button onclick="toggleMute()" class="hover:text-pink-400 transition"><i id="volume-icon" class="fa-solid fa-volume-high"></i></button>
                                <input type="range" min="0" max="1" step="0.05" value="1" class="w-16 h-1 bg-pink-950 rounded-lg appearance-none cursor-pointer accent-pink-500" oninput="cambiarVolumen(this.value)">
                            </div>
                            <span id="time-display" class="text-xs font-mono text-pink-200">0:00 / 0:00</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs px-2 py-0.5 bg-pink-950/80 text-pink-300 rounded-md border border-pink-800/40"><i class="fa-solid fa-lock text-[10px] mr-1"></i><span id="sync-badge">Sincronizados</span></span>
                            <button onclick="toggleFullscreen()" class="hover:text-pink-400 transition"><i class="fa-solid fa-expand text-lg"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-2.5 flex items-center justify-between bg-[#130710] border border-pink-950 px-4 py-2 rounded-xl shrink-0">
                <div class="flex items-center space-x-2 text-xs text-pink-200 truncate">
                    <i class="fa-solid fa-film text-pink-400 shrink-0"></i>
                    <span id="video-status-text" class="font-medium truncate"></span>
                </div>
                <button onclick="resetearVideo()" class="text-xs text-pink-400 hover:text-pink-300 font-medium transition flex items-center space-x-1 shrink-0 ml-2">
                    <i class="fa-solid fa-rotate"></i>
                    <span data-i18n="cambiar">Cambiar película</span>
                </button>
            </div>
        </section>

        <!-- CHAT -->
        <section class="w-full lg:w-96 flex flex-col h-1/2 lg:h-full bg-[#11050e] border-t lg:border-t-0 lg:border-l border-pink-900/40 shrink-0 min-h-0">

            <div class="px-4 py-3 bg-[#170815] border-b border-pink-900/30 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-pink-600 to-rose-400 flex items-center justify-center text-white text-sm shadow">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-white leading-tight" data-i18n="chat_titulo">Chat Amoroso 💖</h3>
                        <p class="text-[11px] text-pink-300/70" data-i18n="chat_sub">Tú y tu pareja</p>
                    </div>
                </div>
                <span id="chat-header-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3.5 flex flex-col min-h-0">
                <div class="self-center my-1 px-3 py-1 bg-pink-950/50 border border-pink-900/50 rounded-full text-[11px] text-pink-300 shrink-0" data-i18n="sala_lista">
                    Sala romántica lista 💖
                </div>
            </div>

            <div class="px-3 py-2 bg-[#140612] border-t border-pink-900/30 flex items-center justify-around shrink-0">
                <button onclick="enviarReaccion('💖')" class="w-9 h-9 rounded-xl bg-pink-950/60 hover:bg-pink-900/80 border border-pink-800/40 text-base flex items-center justify-center transform hover:scale-110 active:scale-95 transition shadow">💖</button>
                <button onclick="enviarReaccion('🎀')" class="w-9 h-9 rounded-xl bg-pink-950/60 hover:bg-pink-900/80 border border-pink-800/40 text-base flex items-center justify-center transform hover:scale-110 active:scale-95 transition shadow">🎀</button>
                <button onclick="enviarReaccion('😭')" class="w-9 h-9 rounded-xl bg-pink-950/60 hover:bg-pink-900/80 border border-pink-800/40 text-base flex items-center justify-center transform hover:scale-110 active:scale-95 transition shadow">😭</button>
                <button onclick="enviarReaccion(':3')" class="w-9 h-9 rounded-xl bg-pink-950/60 hover:bg-pink-900/80 border border-pink-800/40 text-xs font-bold text-pink-200 flex items-center justify-center transform hover:scale-110 active:scale-95 transition shadow">:3</button>
                <button onclick="enviarReaccion('-3-')" class="w-9 h-9 rounded-xl bg-pink-950/60 hover:bg-pink-900/80 border border-pink-800/40 text-xs font-bold text-pink-200 flex items-center justify-center transform hover:scale-110 active:scale-95 transition shadow">-3-</button>
                <button onclick="enviarReaccion('D:')" class="w-9 h-9 rounded-xl bg-pink-950/60 hover:bg-pink-900/80 border border-pink-800/40 text-xs font-bold text-pink-200 flex items-center justify-center transform hover:scale-110 active:scale-95 transition shadow">D:</button>
            </div>

            <div class="p-3 bg-[#170815] border-t border-pink-900/30 shrink-0">
                <form onsubmit="enviarMensajeTexto(event)" class="flex items-center space-x-2">
                    <input type="text" id="chat-input" maxlength="500" autocomplete="off" data-i18n-ph="placeholder" class="flex-1 bg-pink-950/40 border border-pink-900/60 rounded-xl px-3.5 py-2 text-xs text-white placeholder-pink-400/50 focus:outline-none focus:border-pink-500 transition">
                    <button type="submit" class="w-9 h-9 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white rounded-xl flex items-center justify-center shadow-md shadow-pink-900/40 transition">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

<script>
    /* ============ IDIOMAS (ES / RU) ============ */
    const I18N = {
        es: {
            titulo: 'Cine para dos 💖',
            h1: 'Cine para dos',
            badge: 'Noche de Pelis',
            est_buscando: 'Conectando...',
            est_esperando: 'Esperando a tu persona favorita...',
            est_conectado: 'Tu persona favorita está conectada ❤️',
            est_desconectado: 'Conexión perdida, reconectando...',
            est_error: 'Error:',
            copiar: 'Copiar Enlace',
            copiado: '¡Enlace copiado! 💖',
            sube_titulo: 'Elige la película para esta noche 🍿✨',
            sube_desc: 'Elige un video de tu dispositivo. Los dos deben tener el mismo archivo y la reproducción se sincroniza sola.',
            sube_btn: 'Seleccionar video',
            sincronizados: 'Sincronizados',
            sin_conexion: 'Sin conexión',
            sin_video: 'Ningún video seleccionado',
            cambiar: 'Cambiar película',
            chat_titulo: 'Chat Amoroso 💖',
            chat_sub: 'Tú y tu pareja',
            sala_lista: 'Sala romántica lista 💖',
            placeholder: 'Escribe un mensaje cariñoso...',
            persona_fav: 'Tu persona favorita',
            aviso_listo: 'Todo listo para ver películas :3',
            aviso_salio: 'Tu persona favorita se desconectó',
            aviso_formato: 'No se puede reproducir este formato. Prueba con un .mp4'
        },
        ru: {
            titulo: 'Кино для двоих 💖',
            h1: 'Кино для двоих',
            badge: 'Киновечер',
            est_buscando: 'Подключение...',
            est_esperando: 'Ждём твоего любимого человека...',
            est_conectado: 'Твой любимый человек в сети ❤️',
            est_desconectado: 'Соединение потеряно, переподключаемся...',
            est_error: 'Ошибка:',
            copiar: 'Копировать ссылку',
            copiado: 'Ссылка скопирована! 💖',
            sube_titulo: 'Выбери фильм на сегодняшний вечер 🍿✨',
            sube_desc: 'Выбери видео на своём устройстве. У вас обоих должен быть один и тот же файл — воспроизведение синхронизируется само.',
            sube_btn: 'Выбрать видео',
            sincronizados: 'Синхронизировано',
            sin_conexion: 'Нет связи',
            sin_video: 'Видео не выбрано',
            cambiar: 'Сменить фильм',
            chat_titulo: 'Любовный чат 💖',
            chat_sub: 'Ты и твоя половинка',
            sala_lista: 'Романтическая комната готова 💖',
            placeholder: 'Напиши что-нибудь ласковое...',
            persona_fav: 'Твой любимый человек',
            aviso_listo: 'Всё готово для просмотра фильмов :3',
            aviso_salio: 'Твой любимый человек отключился',
            aviso_formato: 'Этот формат не воспроизводится. Попробуй .mp4'
        }
    };

    function idiomaDelNavegador() {
        return ((navigator.language || '').toLowerCase().indexOf('ru') === 0) ? 'ru' : 'es';
    }
    let lang = idiomaDelNavegador();
    try { lang = localStorage.getItem('cine_lang') || lang; } catch (e) {}

    function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.es[k] || k; }

    function setLang(l) {
        lang = l;
        try { localStorage.setItem('cine_lang', l); } catch (e) {}
        aplicarIdioma();
    }

    function aplicarIdioma() {
        document.documentElement.lang = lang;
        document.title = t('titulo');
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
        const on = 'px-2.5 py-1.5 transition bg-pink-600 text-white';
        const off = 'px-2.5 py-1.5 transition bg-pink-950/60 text-pink-300 hover:bg-pink-900/60';
        document.getElementById('lang-es').className = (lang === 'es') ? on : off;
        document.getElementById('lang-ru').className = (lang === 'ru') ? on : off;
        renderEstado();
        renderNombreVideo();
    }

    /* ============ ELEMENTOS ============ */
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const uploadScreen = document.getElementById('upload-screen');
    const videoContainer = document.getElementById('video-container');
    const videoSection = document.getElementById('video-section');
    const mainVideo = document.getElementById('main-video');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const videoStatusText = document.getElementById('video-status-text');
    const playIcon = document.getElementById('play-icon');
    const volumeIcon = document.getElementById('volume-icon');
    const connDot = document.getElementById('connection-dot');
    const connText = document.getElementById('connection-text');
    const chatDot = document.getElementById('chat-header-dot');
    const syncBadge = document.getElementById('sync-badge');

    /* ============ ESTADO DE CONEXIÓN ============ */
    const ESTADOS = {
        buscando:     { dot: 'bg-amber-400 animate-pulse', key: 'est_buscando' },
        esperando:    { dot: 'bg-amber-400 animate-pulse', key: 'est_esperando' },
        conectado:    { dot: 'bg-emerald-500',             key: 'est_conectado' },
        desconectado: { dot: 'bg-red-500',                 key: 'est_desconectado' },
        error:        { dot: 'bg-red-500',                 key: 'est_error' }
    };
    let estadoActual = 'buscando';
    let estadoExtra = '';

    function setEstado(nombre, extra) {
        estadoActual = nombre;
        estadoExtra = extra || '';
        renderEstado();
    }

    function renderEstado() {
        const e = ESTADOS[estadoActual];
        connDot.className = 'w-2 h-2 rounded-full shrink-0 ' + e.dot;
        chatDot.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' + e.dot;
        connText.textContent = t(e.key) + (estadoActual === 'error' ? ' ' + estadoExtra : '');
        syncBadge.textContent = (estadoActual === 'conectado') ? t('sincronizados') : t('sin_conexion');
    }

    // Si algo falla en el código, se muestra arriba
    window.addEventListener('error', e => {
        connText.textContent = 'Error: ' + e.message;
    });

    /* ============ CONEXIÓN ENTRE LOS DOS (PeerJS) ============ */
    const SALA = 'cine-aris-y-ella-8472';

    const CONFIG_ICE = {
        iceServers: [
            { urls: 'stun:stun.relay.metered.ca:80' },
            { urls: 'turn:global.relay.metered.ca:80', username: '5e96c408f879e7714072e620', credential: 'Nc6hPZPr4kIltaId' },
            { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '5e96c408f879e7714072e620', credential: 'Nc6hPZPr4kIltaId' },
            { urls: 'turn:global.relay.metered.ca:443', username: '5e96c408f879e7714072e620', credential: 'Nc6hPZPr4kIltaId' },
            { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '5e96c408f879e7714072e620', credential: 'Nc6hPZPr4kIltaId' }
        ]
    };

    let peer = null, conn = null;
    let ignorar = false, timerIgnorar = null, reiniciando = false;

    function enviar(msg) {
        if (conn && conn.open) {
            try { conn.send(msg); } catch (e) {}
        }
    }

    function configurarConexion(c) {
        conn = c;
        c.on('open', () => {
            setEstado('conectado');
            agregarAvisoSistema(t('aviso_listo'));
        });
        c.on('close', () => {
            if (conn !== c) return;
            conn = null;
            setEstado('desconectado');
            agregarAvisoSistema(t('aviso_salio'));
            reiniciar();
        });
        c.on('error', () => {});
        c.on('data', recibir);
    }

    function reiniciar() {
        if (reiniciando) return;
        reiniciando = true;
        try { if (peer) peer.destroy(); } catch (e) {}
        peer = null;
        setTimeout(() => { reiniciando = false; iniciar(); }, 1500 + Math.random() * 1500);
    }

    function unirseComoInvitado() {
        setEstado('buscando');
        const p = new Peer({ config: CONFIG_ICE });
        peer = p;
        p.on('open', () => configurarConexion(p.connect(SALA, { reliable: true })));
        p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
        p.on('error', err => {
            if (err.type === 'peer-unavailable') {
                reiniciar();
            } else {
                setEstado('error', err.type);
            }
        });
    }

    function iniciar() {
        setEstado('buscando');
        const p = new Peer(SALA, { config: CONFIG_ICE });
        peer = p;
        p.on('open', () => setEstado('esperando'));
        p.on('connection', configurarConexion);
        p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
        p.on('error', err => {
            if (err.type === 'unavailable-id') {
                try { p.destroy(); } catch (e) {}
                unirseComoInvitado();
            } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed') {
                setEstado('error', err.type);
                reiniciar();
            } else {
                setEstado('error', err.type);
            }
        });
    }

    /* Lo que llega desde la otra persona */
    function recibir(msg) {
        if (!msg || !msg.tipo) return;
        if (msg.tipo === 'chat') { agregarMensajeOtro(String(msg.texto || '').slice(0, 1000), t('persona_fav')); return; }
        if (msg.tipo === 'react') { mostrarReaccion(String(msg.emoji || '').slice(0, 4)); return; }

        if (!mainVideo.currentSrc) return; // todavía no eligió su video
        ignorar = true;
        clearTimeout(timerIgnorar);
        if (typeof msg.tiempo === 'number' && Math.abs(mainVideo.currentTime - msg.tiempo) > 0.5) {
            mainVideo.currentTime = msg.tiempo;
        }
        if (msg.tipo === 'play') mainVideo.play().catch(() => {});
        if (msg.tipo === 'pause') mainVideo.pause();
        timerIgnorar = setTimeout(() => { ignorar = false; }, 600);
    }

    /* Lo que haces tú en el video se envía a la otra persona */
    mainVideo.addEventListener('play', () => {
        playIcon.className = 'fa-solid fa-pause text-lg';
        videoContainer.classList.remove('is-paused');
        if (!ignorar) enviar({ tipo: 'play', tiempo: mainVideo.currentTime });
    });
    mainVideo.addEventListener('pause', () => {
        playIcon.className = 'fa-solid fa-play text-lg';
        videoContainer.classList.add('is-paused');
        if (!ignorar) enviar({ tipo: 'pause', tiempo: mainVideo.currentTime });
    });
    mainVideo.addEventListener('seeked', () => {
        if (!ignorar) enviar({ tipo: 'seek', tiempo: mainVideo.currentTime });
    });
    mainVideo.addEventListener('volumechange', () => {
        volumeIcon.className = (mainVideo.muted || mainVideo.volume === 0) ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    });
    mainVideo.addEventListener('error', () => {
        if (mainVideo.getAttribute('src')) agregarAvisoSistema(t('aviso_formato'));
    });

    /* ============ CHAT Y REACCIONES ============ */
    function horaActual() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function agregarMensajeOtro(texto, etiqueta) {
        const fila = document.createElement('div');
        fila.className = 'flex items-start space-x-2.5 my-1 shrink-0';

        const avatar = document.createElement('div');
        avatar.className = 'w-7 h-7 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white text-xs font-bold shrink-0 shadow';
        avatar.innerHTML = '<i class="fa-solid fa-heart"></i>';

        const col = document.createElement('div');
        col.className = 'flex flex-col space-y-1 max-w-[85%]';

        const burbuja = document.createElement('div');
        burbuja.className = 'bg-pink-950/80 border border-pink-900/60 rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-xs text-pink-100 shadow-sm leading-relaxed break-words';
        burbuja.textContent = texto;

        const pie = document.createElement('span');
        pie.className = 'text-[10px] text-pink-400/60 pl-1';
        pie.textContent = etiqueta + ' • ' + horaActual();

        col.appendChild(burbuja);
        col.appendChild(pie);
        fila.appendChild(avatar);
        fila.appendChild(col);
        chatMessages.appendChild(fila);
        scrollToBottom();
    }

    function agregarAvisoSistema(texto) {
        const div = document.createElement('div');
        div.className = 'self-center my-1 px-3.5 py-1 bg-pink-950/60 border border-pink-800/60 rounded-full text-[11px] text-pink-200 font-medium shadow-sm shrink-0 text-center';
        div.textContent = texto;
        chatMessages.appendChild(div);
        scrollToBottom();
    }

    function enviarMensajeTexto(e) {
        e.preventDefault();
        const texto = chatInput.value.trim();
        if (!texto) return;

        const fila = document.createElement('div');
        fila.className = 'flex justify-end my-1 shrink-0';
        const burbuja = document.createElement('div');
        burbuja.className = 'bg-gradient-to-r from-pink-600 to-rose-600 rounded-2xl rounded-tr-sm px-3.5 py-2.5 text-xs text-white max-w-[85%] shadow-md leading-relaxed break-words';
        burbuja.textContent = texto;
        fila.appendChild(burbuja);
        chatMessages.appendChild(fila);

        enviar({ tipo: 'chat', texto: texto });
        chatInput.value = '';
        scrollToBottom();
    }

    function mostrarReaccion(emoji) {
        const flotante = document.createElement('div');
        flotante.className = 'floating-emoji';
        flotante.textContent = emoji;
        flotante.style.left = (Math.random() * 70 + 15) + '%';
        flotante.style.bottom = '100px';
        videoSection.appendChild(flotante);
        setTimeout(() => flotante.remove(), 2200);
    }

    function enviarReaccion(emoji) {
        mostrarReaccion(emoji);
        enviar({ tipo: 'react', emoji: emoji });
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    /* ============ VIDEO ============ */
    let nombreVideo = '';
    let urlVideo = null;

    function renderNombreVideo() {
        videoStatusText.textContent = nombreVideo || t('sin_video');
    }

    function cargarVideoLocal(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (urlVideo) URL.revokeObjectURL(urlVideo);
        urlVideo = URL.createObjectURL(file);
        mainVideo.src = urlVideo;
        uploadScreen.classList.add('hidden');
        videoContainer.classList.remove('hidden');
        videoContainer.classList.add('is-paused');
        nombreVideo = file.name;
        renderNombreVideo();
    }

    function resetearVideo() {
        mainVideo.pause();
        mainVideo.removeAttribute('src');
        mainVideo.load();
        if (urlVideo) { URL.revokeObjectURL(urlVideo); urlVideo = null; }
        document.getElementById('video-file-input').value = '';
        videoContainer.classList.add('hidden');
        uploadScreen.classList.remove('hidden');
        nombreVideo = '';
        renderNombreVideo();
    }

    function togglePlay() {
        if (mainVideo.paused) { mainVideo.play().catch(() => {}); } else { mainVideo.pause(); }
    }

    function saltoTiempo(segundos) {
        mainVideo.currentTime = Math.max(0, mainVideo.currentTime + segundos);
    }

    function cambiarVolumen(val) { mainVideo.volume = val; mainVideo.muted = false; }
    function toggleMute() { mainVideo.muted = !mainVideo.muted; }

    function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (videoContainer.requestFullscreen) {
            videoContainer.requestFullscreen();
        } else if (mainVideo.webkitEnterFullscreen) {
            mainVideo.webkitEnterFullscreen(); // iPhone
        }
    }

    function formatoTiempo(s) {
        s = Math.floor(s || 0);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const seg = String(s % 60).padStart(2, '0');
        return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + seg : m + ':' + seg;
    }

    mainVideo.addEventListener('timeupdate', () => {
        if (mainVideo.duration) {
            seekBar.value = (mainVideo.currentTime / mainVideo.duration) * 100;
            timeDisplay.textContent = formatoTiempo(mainVideo.currentTime) + ' / ' + formatoTiempo(mainVideo.duration);
        }
    });

    function cambiarProgreso(val) {
        if (mainVideo.duration) mainVideo.currentTime = (val / 100) * mainVideo.duration;
    }

    function copiarEnlace() {
        try {
            navigator.clipboard.writeText(window.location.href.split('?')[0]);
        } catch (e) {}
        alert(t('copiado'));
    }

    /* ============ ARRANQUE ============ */
    window.addEventListener('DOMContentLoaded', () => {
        aplicarIdioma();
        iniciar();

        // Mensaje de bienvenida (se muestra una sola vez por dispositivo)
        let visto = false;
        try { visto = !!localStorage.getItem('cine_bienvenida_v1'); } catch (e) {}
        if (!visto) {
            try { localStorage.setItem('cine_bienvenida_v1', '1'); } catch (e) {}
            setTimeout(() => {
                agregarMensajeOtro(
                    'Я сделал это приложение, чтобы мы вместе смотрели фильмы и сериалы. Раньше всё зависало и было неудобно, а мне хотелось сделать это проще для нас. Помни, что я очень сильно тебя люблю, и надеюсь, наши следующие фильмы мы посмотрим уже тут :3c',
                    'hamiliza'
                );
            }, 400);
        }
    });
</script>
</body>
</html>
