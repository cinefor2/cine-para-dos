<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cine para dos</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; text-align:center; margin:0; padding:20px; }
  video { width:100%; max-width:900px; background:#000; border-radius:8px; }
  input { padding:10px; margin:5px; font-size:16px; }
  #estado { margin:10px; color:#aaa; }
</style>
</head>
<body>
  <h1>🎬 Cine para dos</h1>
  <div id="estado">Conectando...</div>

  <input type="file" id="archivo" accept="video/*"><br><br>
  <video id="video" controls></video>

<script>
  // CAMBIA ESTO por algo que solo ustedes dos sepan (letras y números, sin espacios)
  const SALA = 'cine-para-dos-cambiame-por-algo-secreto-123';

  const video = document.getElementById('video');
  const estado = document.getElementById('estado');
  let peer, conn;
  let ignorar = false;

  document.getElementById('archivo').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) video.src = URL.createObjectURL(f);
  });

  function enviar(msg) {
    if (conn && conn.open) conn.send(msg);
  }

  function configurarConexion(c) {
    conn = c;
    c.on('open', () => estado.textContent = '✅ Conectados');
    c.on('close', () => estado.textContent = 'Se desconectó, recarga la página');
    c.on('data', recibir);
  }

  function recibir(msg) {
    ignorar = true;
    if (Math.abs(video.currentTime - msg.tiempo) > 0.5) video.currentTime = msg.tiempo;
    if (msg.tipo === 'play') video.play();
    if (msg.tipo === 'pause') video.pause();
    setTimeout(() => ignorar = false, 400);
  }

  video.addEventListener('play',   () => { if (!ignorar) enviar({ tipo:'play',  tiempo: video.currentTime }); });
  video.addEventListener('pause',  () => { if (!ignorar) enviar({ tipo:'pause', tiempo: video.currentTime }); });
  video.addEventListener('seeked', () => { if (!ignorar) enviar({ tipo:'seek',  tiempo: video.currentTime }); });

  // Conexión automática: el primero espera, el segundo se une
  function unirseComoInvitado() {
    peer = new Peer();
    peer.on('open', () => configurarConexion(peer.connect(SALA)));
    peer.on('error', err => estado.textContent = 'Error: ' + err.type + ' (recarga la página)');
  }

  function iniciar() {
    peer = new Peer(SALA);
    peer.on('open', () => estado.textContent = 'Esperando a que entre la otra persona...');
    peer.on('connection', configurarConexion);
    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        unirseComoInvitado();
      } else {
        estado.textContent = 'Error: ' + err.type + ' (recarga la página)';
      }
    });
  }

  iniciar();
</script>
</body>
</html>
